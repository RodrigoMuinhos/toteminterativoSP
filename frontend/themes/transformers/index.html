<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03162b">
<link rel="preload" as="image" href="emblema-autobot.webp">
<title>Transformers · Escolha seu Autobot</title>
<link rel="preload" as="image" href="revelacao.webp">
<link rel="stylesheet" href="styles.css">
<main class="poster" aria-label="Totem Transformers · Optimus Prime">
  <img class="art blueprint" src="blueprint.webp" alt="Optimus Prime em blueprint" draggable="false">
  <div class="charge" aria-hidden="true"><img class="art" src="revelacao.webp" alt="" draggable="false"></div>
  <img class="art reveal" src="revelacao.webp" alt="" draggable="false">
  <div class="beam" aria-hidden="true"></div>
  <div class="reveal-glow" aria-hidden="true"></div>
  <div class="flash" aria-hidden="true"></div>
  <div class="scan-progress" aria-hidden="true"><i></i></div>
  <button class="scan-pad" type="button" disabled aria-label="Pressione e segure para carregar o scan">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
      <path d="M14 22v-8h8m20 0h8v8m0 20v8h-8m-20 0h-8v-8" opacity=".55"/>
      <path d="M27 50c-6-5-11-11-11-15 0-3 3-4 5-2l4 4V19a3 3 0 0 1 6 0v11-15a3 3 0 0 1 6 0v15-12a3 3 0 0 1 6 0v14-8a3 3 0 0 1 6 0v14c0 6-2 9-6 12z" fill="#176383" stroke="#a0faff"/>
      <path d="M18 35h33" stroke="#f1ffff"/>
    </svg>
    <span>Toque e segure</span>
  </button>
  <button class="poster-entry" type="button" aria-label="Começar a experiência Transformers"><img src="poster-transformers.jpg" alt="Pôster dos Autobots de Transformers" draggable="false"></button>
  <button class="kioskHome" type="button" data-action="home" aria-label="Voltar ao início" hidden><svg viewBox="0 0 64 64" aria-hidden="true"><path d="m10 28 22-17 22 17v24H39V37H25v15H10Z" fill="currentColor"/></svg></button>
  <section class="autobots" aria-label="Autobots" hidden></section>
  <div class="return-glow" aria-hidden="true"></div>
  <span class="sr-only" role="status" aria-live="polite"></span>
</main>
<script src="app.js" defer></script>
</html>
