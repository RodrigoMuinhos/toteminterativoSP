<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10101b">
  <meta name="description" content="Escolha o tema do seu totem: My Little Pony ou Transformers.">
  <title>Totem Interativo SP · Escolha o tema</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main aria-label="Escolha o tema do totem">
    <header>
      <p class="eyebrow"><span></span> Totem Interativo SP</p>
      <h1>Qual será a<br>sua aventura?</h1>
      <p class="intro">Escolha um tema para começar.</p>
    </header>
    <nav class="themes" aria-label="Temas disponíveis">
      <a class="theme pony" href="my-little-pony/" aria-label="Abrir o totem My Little Pony">
        <img src="previews/my-little-pony.png" alt="As amigas de My Little Pony sobre o arco-íris" draggable="false">
        <div class="theme-caption"><div><span class="theme-label">Um mundo de amizade</span><h2>My Little Pony</h2></div><span class="arrow" aria-hidden="true">↗</span></div>
      </a>
      <a class="theme transformers" href="transformers/" aria-label="Abrir o totem Transformers">
        <img src="previews/transformers-vertical.webp" alt="Optimus Prime e Megatron no pôster clássico de Transformers" draggable="false">
        <div class="theme-caption"><div><span class="theme-label">Ative o seu poder</span><h2>Transformers</h2></div><span class="arrow" aria-hidden="true">↗</span></div>
      </a>
    </nav>
    <footer>Dois universos. Uma escolha.</footer>
  </main>
</body>
</html>
